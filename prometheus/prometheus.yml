global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Premium Prediction API
  - job_name: "premium-api"
    static_configs:
      - targets: ["premium-api:8000"]
    metrics_path: /metrics

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
