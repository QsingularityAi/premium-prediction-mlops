apiVersion: v1
kind: Secret
metadata:
  name: premium-model-secrets
  namespace: mlops-premium
type: Opaque
# This is a template - actual secrets should be created securely and not committed to version control
# Use Kubernetes secret management best practices in production
data:
  # Base64 encoded values - example only, replace with real secrets
  API_KEY: BASE64_ENCODED_API_KEY_HERE
  DB_PASSWORD: BASE64_ENCODED_DB_PASSWORD_HERE
  MLFLOW_TRACKING_TOKEN: BASE64_ENCODED_MLFLOW_TOKEN_HERE
  SLACK_WEBHOOK_URL: BASE64_ENCODED_SLACK_WEBHOOK_HERE

