apiVersion: v1
kind: Service
metadata:
  name: premium-model-api-service
  namespace: mlops-premium
  labels:
    app: premium-model-api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: premium-model-api
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  type: ClusterIP

