apiVersion: apps/v1
kind: Deployment
metadata:
  name: premium-model-api
  namespace: mlops-premium
  labels:
    app: premium-model-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: premium-model-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: premium-model-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: premium-model-api
        image: premium-model-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        resources:
          requests:
            cpu: "0.5"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        envFrom:
        - configMapRef:
            name: premium-model-config
        - secretRef:
            name: premium-model-secrets
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 60
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: model-data
          mountPath: /app/models
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: model-data
        persistentVolumeClaim:
          claimName: premium-model-pvc
      - name: logs
        emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: premium-model-pvc
  namespace: mlops-premium
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: premium-model-api-hpa
  namespace: mlops-premium
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: premium-model-api
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

