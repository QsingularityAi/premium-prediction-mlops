version: '3.8'

services:
  # Premium Prediction API Service
  premium-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: premium-prediction-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./artifacts:/app/artifacts
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_WORKERS=4
      - LOG_LEVEL=info
      - ENABLE_DOCS=true
      - ENABLE_MONITORING=true
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - FEATURE_DRIFT_THRESHOLD=0.1
      - MODEL_PERFORMANCE_THRESHOLD_RMSE=0.15
      - MODEL_PERFORMANCE_THRESHOLD_R2=0.75
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus_multiproc_dir
    depends_on:
      - mlflow
      - prometheus
    networks:
      - mlops-network

  # MLflow tracking server
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.5.0
    container_name: mlflow-tracking
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
      - ./artifacts:/mlflow-artifacts
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlruns.db --default-artifact-root /mlflow-artifacts
    networks:
      - mlops-network

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:v2.41.0
    container_name: premium-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - mlops-network

  # Grafana for visualization
  grafana:
    image: grafana/grafana:9.3.6
    container_name: premium-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin  # Change this in production
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - mlops-network

networks:
  mlops-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:

