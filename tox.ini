[tox]
envlist = py39, py310, py311, lint, type, coverage
isolated_build = True
skip_missing_interpreters = True

[testenv]
deps =
    pytest>=7.0.0
    pytest-cov>=4.0.0
    pytest-mock>=3.10.0
commands =
    pytest {posargs:tests}

[testenv:lint]
deps =
    black>=23.0.0
    flake8>=6.0.0
    isort>=5.0.0
commands =
    black --check src tests
    flake8 src tests
    isort --check --profile black src tests

[testenv:type]
deps =
    mypy>=1.0.0
    types-PyYAML
    types-requests
    pandas-stubs
commands =
    mypy src

[testenv:coverage]
deps =
    pytest>=7.0.0
    pytest-cov>=4.0.0
commands =
    pytest --cov=src --cov-report=xml --cov-report=term

[testenv:docs]
deps =
    sphinx>=6.0.0
    sphinx-rtd-theme>=1.2.0
commands =
    sphinx-build -b html docs/source docs/build/html

[flake8]
max-line-length = 100
exclude = .git,__pycache__,build,dist,.tox,venv
ignore = E203, W503

[isort]
profile = black
line_length = 100
multi_line_output = 3

[mypy]
python_version = 3.9
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
strict_optional = True

