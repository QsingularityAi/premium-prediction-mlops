[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --strict-markers
    --cov=src
    --cov-report=term
    --cov-report=html
    -v

# Custom markers for different test types
markers =
    unit: unit tests (fast execution)
    integration: integration tests (may need external dependencies)
    slow: slow tests that take longer to run
    e2e: end-to-end tests (require full system setup)
    smoke: quick smoke tests to verify basic functionality
    data: tests focusing on data processing
    model: tests focusing on model functionality
    api: tests focusing on API functionality
    monitoring: tests focusing on monitoring functionality
    deployment: tests focusing on deployment

# Log settings
log_cli = True
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings treatment
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::FutureWarning

